plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.codeghost.songbook'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.codeghost.songbook"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        resourceConfigurations += ["en"]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
}
